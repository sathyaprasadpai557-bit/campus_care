services:
  - type: web
    name: campus-care-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-care-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Campus Administrator
      - key: UPLOAD_DIR
        value: /tmp/campus-care-uploads
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_GALLERY_UPLOAD
        value: "false"

databases:
  - name: campus-care-db
    databaseName: campus_care
    user: campus_care_user
    plan: free
